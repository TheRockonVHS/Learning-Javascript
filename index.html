<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" type="text/css" href="style.css" />
  <title>Session 12</title>
</head>

<body>
  <h1>COGS Calculator</h1>
  <input type="text" id="label" placeholder="COGS Label">
  <input type="number" id="ink" placeholder="Ink Cost Per SQ">
  <input type="number" id="vinyl" placeholder="Vinyl Cost Per SQ">
  <input type="number" id="laminate" placeholder="Laminate Cost Per SQ">
  <input type="number" id="app_tape" placeholder="Applicate Tape Cost Per SQ">
  <input type="number" id="substrate" placeholder="Substrate Cost Per SQ">
  <input type="number" id="width" placeholder="Width in Inches">
  <input type="number" id="height" placeholder="Height in Inches">
  <input type="number" id="qty" placeholder="Qty">
  <input type="number" id="prod_hours" placeholder="Production Labor Time">
  <input type="number" id="prod_rate" placeholder="Production Labor Rate">
  <input type="number" id="design_hours" placeholder="Design Labor Time">
  <input type="number" id="design_rate" placeholder="Design Labor Rate">

  <button id="addBtn">Calculate</button>

  <script src="COGSCalc.js"></script>
</body>

</html>
